{% extends 'base_crud.html' %}
{% block title %}Agregar Destino{% endblock %}
{% block content %}
<h2><i class="fa fa-plus-circle" aria-hidden="true"></i> Agregar Destino Turístico</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="fa fa-floppy-o"></i> Guardar</button>
        <a href="{% url 'index' %}" class="btn btn-secondary"><i class="fa fa-times"></i> Cancelar</a>
    </div>
</form>
{% endblock %}
