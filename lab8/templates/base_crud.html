{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <title>{% block title %}Destinos Turísticos{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/bootstrap4/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/main_styles.css' %}">
    <link href="{% static 'plugins/font-awesome-4.7.0/css/font-awesome.min.css' %}" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .crud-container { margin-top: 30px; }
        .crud-card { border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); padding: 30px; background: white; }
        .crud-card h2 { color: #1e3c72; font-weight: 700; margin-bottom: 25px; }
        .crud-card form p { margin-bottom: 15px; }
        .crud-card form label { font-weight: 600; color: #333; }
        .crud-card form input, .crud-card form select, .crud-card form textarea { border-radius: 5px; border: 1px solid #ddd; padding: 8px 12px; width: 100%; }
        .navbar-custom { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 15px 0; }
        .navbar-custom .navbar-brand { color: white; font-weight: 700; font-size: 24px; }
        .navbar-custom .nav-link { color: rgba(255,255,255,0.8) !important; }
        .navbar-custom .nav-link:hover { color: white !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">Destinos Turísticos</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'agregar' %}">Agregar</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container crud-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="crud-card">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
