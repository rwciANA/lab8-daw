{% extends 'base_crud.html' %}
{% block title %}Eliminar Destino{% endblock %}
{% block content %}
<h2><i class="fa fa-trash" aria-hidden="true"></i> Eliminar Destino Turístico</h2>
<p class="lead">¿Estás seguro de eliminar <strong>{{ destino.nombreCiudad }}</strong>?</p>
<div class="alert alert-danger">
    <i class="fa fa-exclamation-triangle"></i> Esta acción no se puede deshacer.
</div>
<form method="POST">
    {% csrf_token %}
    <div class="mt-4">
        <button type="submit" class="btn btn-danger"><i class="fa fa-trash"></i> Eliminar</button>
        <a href="{% url 'index' %}" class="btn btn-secondary"><i class="fa fa-times"></i> Cancelar</a>
    </div>
</form>
{% endblock %}
